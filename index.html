<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展示门户 · houguofei</title>
<meta name="description" content="GitHub Pages 展示门户：集中列出仓库中的所有静态展示项目。">
<style>
:root {
  --bg: #f5f6f8; --surface: #fff; --text: #1a1d21; --muted: #5b636e;
  --line: #e3e6ea; --accent: #2563eb; --accent-soft: #eaf0ff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161a; --surface: #1c1f24; --text: #eceef1;
    --muted: #9aa3ae; --line: #2b3038; --accent: #7aa2ff; --accent-soft: #1f2739; }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 20px 48px; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Roboto, sans-serif;
  line-height: 1.7; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 860px; margin: 0 auto; }
header { padding: 56px 0 24px; }
.eyebrow { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { margin: 0 0 10px; font-size: clamp(26px, 5vw, 38px); line-height: 1.25; }
.lead { margin: 0; color: var(--muted); font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 20px; }
a.card {
  display: block; padding: 20px 22px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; color: inherit;
  text-decoration: none; transition: transform .12s ease, border-color .12s ease;
}
a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card h2 { margin: 0 0 6px; font-size: 17px; color: var(--accent); }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
.card .date { display: block; margin-top: 10px; font-size: 12.5px; color: var(--muted); opacity: .8; }
.status { margin-top: 24px; padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); color: var(--muted); font-size: 14px; }
footer { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">GitHub Pages · 展示门户</p>
    <h1>静态展示集合</h1>
    <p class="lead">下面列出本仓库 <code>shows/</code> 目录中的所有展示项目，推送新项目后本页自动收录。</p>
  </header>

  <div class="grid">
    <a class="card" href="./pages-tutorial/">
      <h2>Pages 使用教程</h2>
      <p>GitHub Pages 部署三步走、上线检查清单、常见问题排查，含运行时自检。</p>
      <span class="date">内置示例</span>
    </a>
    <div id="shows"></div>
  </div>

  <p class="status" id="status">正在加载展示列表…</p>

  <footer>
    <p>发布方式见仓库 <a href="https://github.com/houguofei/github-pages-demo">README</a> · 新项目放入 <code>shows/</code> 子目录并推送即可上线</p>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var API = "https://api.github.com/repos/houguofei/github-pages-demo/contents/shows?ref=main";
  var grid = document.getElementById("shows");
  var status = document.getElementById("status");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render(list) {
    grid.outerHTML = list.map(function (item) {
      var date = item.date ? '<span class="date">' + esc(item.date) + "</span>" : "";
      var desc = item.desc ? "<p>" + esc(item.desc) + "</p>" : "";
      return '<a class="card" href="./shows/' + esc(item.dir) + '/">' +
        "<h2>" + esc(item.title) + "</h2>" + desc + date + "</a>";
    }).join("");
  }

  // 依次拉取每个子目录的 meta.json（相对路径请求，不占 API 配额）
  fetch(API).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (entries) {
    var dirs = entries.filter(function (e) { return e.type === "dir"; });
    if (!dirs.length) { status.textContent = "shows/ 目录暂无展示项目。"; return; }
    return Promise.all(dirs.map(function (d) {
      return fetch("./shows/" + d.name + "/meta.json")
        .then(function (r) { return r.ok ? r.json() : {}; })
        .catch(function () { return {}; })
        .then(function (meta) {
          return {
            dir: d.name,
            title: meta.title || d.name,
            desc: meta.desc || "",
            date: meta.date || ""
          };
        });
    })).then(render).then(function () {
      status.textContent = "共 " + dirs.length + " 个展示项目，由 GitHub API 自动发现。";
    });
  }).catch(function (err) {
    status.textContent = "展示列表加载失败（" + err.message + "）。可直接浏览 GitHub 仓库的 shows/ 目录，或稍后刷新重试。";
  });
})();
</script>
</body>
</html>

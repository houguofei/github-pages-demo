<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="hero">
  <p class="eyebrow">404</p>
  <h1>这个地址没有对应的页面</h1>
  <p class="lead">GitHub Pages 是纯静态托管：只认识真实存在的文件路径，不存在的地址会交给这个 404 页面。</p>
</header>
<main>
  <section class="card">
    <h2>可以这样处理</h2>
    <ul class="checks">
      <li>回到 <a href="./index.html">站点首页</a>。</li>
      <li>检查链接大小写：GitHub Pages 的路径<strong>区分大小写</strong>，<code>About.html</code> 与 <code>about.html</code> 是两个地址。</li>
      <li>如果是前端路由（SPA），把 <code>index.html</code> 复制为 <code>404.html</code>，让前端接管路由。</li>
    </ul>
  </section>
</main>
<footer><p>GitHub Pages 自定义 404 示例</p></footer>
</body>
</html>
